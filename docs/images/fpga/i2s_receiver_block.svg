<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="i2s-title" font-family="Helvetica, Arial, sans-serif">
  <title id="i2s-title">i2s_receiver block diagram</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#2b3644"/>
    </marker>
    <style>
      .fpga-band { fill: #eaf2fc; stroke: #2780e3; stroke-width: 1.5; }
      .ext { fill: #fdf1e0; stroke: #d9831f; stroke-width: 1.5; }
      .next { fill: #ffffff; stroke: #5b6b7c; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .core { fill: #ffffff; stroke: #1558a8; stroke-width: 2.2; }
      .wire { stroke: #2b3644; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .band { font-size: 15px; font-weight: 700; fill: #17202b; }
      .clock { font-size: 13px; fill: #46535f; }
      .name { font-size: 15px; font-weight: 700; fill: #17202b; text-anchor: middle; }
      .note { font-size: 12.5px; fill: #46535f; text-anchor: middle; }
      .bus { font-size: 12px; fill: #2b3644; }
      .busmid { font-size: 12px; fill: #2b3644; text-anchor: middle; }
    </style>
  </defs>

  <!-- microphone: tall enough that bclk, ws, and sd all run straight -->
  <rect class="ext" x="30" y="80" width="150" height="190" rx="8"/>
  <text class="name" x="105" y="157">SPH0645</text>
  <text class="note" x="105" y="177">I2S MEMS mic</text>
  <text class="note" x="105" y="195">SEL tied to GND</text>
  <text class="note" x="105" y="213">(left channel)</text>

  <!-- FPGA band -->
  <rect class="fpga-band" x="250" y="30" width="420" height="270" rx="10"/>
  <text class="band" x="268" y="54">i2s_receiver</text>
  <text class="clock" x="652" y="54" text-anchor="end">clk = 12 MHz</text>

  <!-- clkgen -->
  <rect class="core" x="330" y="80" width="240" height="70" rx="8"/>
  <text class="name" x="450" y="120">i2s_clkgen</text>

  <!-- deserializer -->
  <rect class="core" x="330" y="200" width="240" height="70" rx="8"/>
  <text class="name" x="450" y="226">i2s_deserializer</text>
  <text class="note" x="450" y="245">18-bit shift register, left channel</text>
  <text class="note" x="450" y="261">slots 1 to 18, MSB first</text>

  <!-- clkgen to deserializer -->
  <path class="wire" d="M450,150 V198"/>
  <text class="bus" x="458" y="179">sample_en, slot[5:0]</text>

  <!-- clocks to the mic -->
  <path class="wire" d="M330,100 H182"/>
  <text class="busmid" x="215" y="93">bclk</text>
  <path class="wire" d="M330,130 H182"/>
  <text class="busmid" x="215" y="123">ws</text>

  <!-- data from the mic -->
  <path class="wire" d="M180,235 H328"/>
  <text class="busmid" x="215" y="228">sd</text>

  <!-- outputs -->
  <path class="wire" d="M570,235 H758"/>
  <text class="bus" x="582" y="228">sample[17:0]</text>
  <text class="bus" x="582" y="252">sample_valid</text>

  <!-- next block -->
  <rect class="next" x="760" y="200" width="170" height="70" rx="8"/>
  <text class="name" x="845" y="226">Sum of 3</text>
  <text class="note" x="845" y="245">and DC removal</text>
  <text class="note" x="845" y="261">(next)</text>
</svg>
